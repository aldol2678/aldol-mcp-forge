name: Sites read-only MCP adapter
on:
  push:
    branches: [main]
    paths: ['adapters/sites/**', 'forge.py', 'templates.py', 'openapi_forge.py', '.github/workflows/verify-sites-adapter.yml']
  pull_request:
    branches: [main, feat/forge-sdk-cloudrun-slack-project]
    paths: ['adapters/sites/**', 'forge.py', 'templates.py', 'openapi_forge.py', '.github/workflows/verify-sites-adapter.yml']
permissions:
  contents: read
concurrency:
  group: sites-adapter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parity-and-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python parity and MCP protocol tests
        working-directory: adapters/sites
        run: |
          mkdir -p ../../ci-results
          set -o pipefail
          node --test tests/*.test.mjs | tee ../../ci-results/sites-tests.tap
      - name: Original Forge validators and official SDK for Studio output
        run: |
          python -m pip install --no-input "mcp==2.0.0"
          python adapters/sites/tests/verify_generated.py --official-sdk > ci-results/sites-studio-sdk.json
      - name: Build and validate Worker artifact
        working-directory: adapters/sites
        run: |
          bash scripts/build.sh
          node scripts/validate-artifact.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sites-readonly-adapter-evidence
          path: ci-results/sites-*
          retention-days: 14
