name: Mobile PWA
on:
  pull_request:
    paths:
      - 'mobile_pwa/**'
      - 'app.py'
      - 'tests/test_mobile_pwa.py'
      - 'tests/mobile_mcp_http.py'
      - 'tests/mobile_browser.py'
      - '.github/workflows/mobile-pwa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt 'uvicorn' 'httpx' playwright
      - run: python tests/test_mobile_pwa.py
      - run: python tests/mobile_mcp_http.py
      - run: python -m playwright install --with-deps chromium
      - run: python tests/mobile_browser.py
