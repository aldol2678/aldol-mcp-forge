name: ALDOL Security source smoke
on:
  pull_request:
    paths:
      - 'packages/security/**'
      - '.github/workflows/security-source-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile source
        run: python -m compileall -q packages/security
      - name: Run security policy and output tests
        run: python -m unittest discover -s packages/security/tests -v
