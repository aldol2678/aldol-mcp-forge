name: RIGHTS service regression
on:
  pull_request:
    paths: ['packages/rights/**', '.github/workflows/verify-rights.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rights-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Forge offline tests deliberately expect no installed MCP SDK.
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install -r packages/rights/requirements.txt pytest==9.1.1
      - run: pytest packages/rights/service/tests -q
      - run: python packages/rights/service/tests/legacy_sdk.py
      - run: python -m compileall -q packages/rights/service
      - run: node --check packages/rights/service/public/app.js
      - run: node --check packages/rights/service/public/legal-ui.js
      - run: node --check packages/rights/service/public/site-policy-ui.js
