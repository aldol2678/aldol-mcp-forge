name: ALDOL enterprise specialist MCP handlers
on:
  pull_request:
    branches: [feat/studio-v8-contract-integration-20261020]
    paths:
      - 'enterprise_mcps/**'
      - 'examples/*-mcp-contract.json'
      - 'contract_forge.py'
      - '.github/workflows/verify-enterprise-specialists.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: enterprise-specialists-${{ github.ref }}
  cancel-in-progress: true
jobs:
  enterprise-sdk:
    name: Nine specialist tools / official MCP SDK v2
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned official MCP SDK
        run: python -m pip install 'mcp==2.0.0'
      - name: Run deterministic specialist logic and error tests
        run: python -m unittest discover -s enterprise_mcps/tests -p test_logic.py -v
      - name: Run real SDK in-memory and stdio tests
        run: python -m unittest discover -s enterprise_mcps/tests -p test_sdk.py -v
