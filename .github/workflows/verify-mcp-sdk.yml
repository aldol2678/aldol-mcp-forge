name: ALDOL MCP Forge - official SDK v2 verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/forge-sdk-cloudrun-slack-project]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-forge-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-regression:
    name: Local regression (no SDK required)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run 26 regression tests
        run: python -m unittest discover -s tests -v

  sdk-integration:
    name: Official SDK v2 (in-memory + stdio)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ALDOL_API_BASE_URL: ''
      ALDOL_API_ALLOWED_HOST: ''
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official MCP SDK v2
        run: |
          python -m pip install --no-input "mcp==2.0.0"
          python -c 'import importlib.metadata; print("Official MCP SDK:", importlib.metadata.version("mcp"))'
      - name: Verify generated servers in both transports
        run: python ci/run_official_sdk.py
      - name: Save machine-readable verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-sdk-v2-results
          path: ci-results/
          if-no-files-found: warn
          retention-days: 14

  forge-sdk-runtime:
    name: Forge itself - Official MCP SDK v2 (in-memory + stdio)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ALDOL_API_BASE_URL: ''
      ALDOL_API_ALLOWED_HOST: ''
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official SDK v2
        run: python -m pip install --no-input "mcp==2.0.0"
      - name: Verify Forge itself using real SDK clients
        run: python ci/verify_forge_sdk.py

  inspector-client-interop:
    name: Independent MCP Inspector CLI stdio client
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ALDOL_API_BASE_URL: ''
      ALDOL_API_ALLOWED_HOST: ''
      PYTHONDONTWRITEBYTECODE: '1'
      npm_config_audit: 'false'
      npm_config_fund: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install official MCP SDK v2
        run: python -m pip install --no-input "mcp==2.0.0"
      - name: Verify independent MCP Inspector CLI client
        run: python ci/verify_inspector_cli.py
      - name: Upload independent client evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspector-client-verification
          path: ci-results/inspector-client-verification.json
          if-no-files-found: warn
          retention-days: 14
