name: Python Forge bridge (trusted local worker)
on:
  pull_request:
    branches: [main]
    paths:
      - 'bridge/**'
      - '.github/workflows/verify-python-bridge.yml'
      - 'forge.py'
      - 'forge_sdk.py'
      - 'sandbox.py'
      - 'templates.py'
      - 'openapi_forge.py'
  push:
    branches: [main]
    paths:
      - 'bridge/**'
      - '.github/workflows/verify-python-bridge.yml'
      - 'forge.py'
      - 'forge_sdk.py'
      - 'sandbox.py'
      - 'templates.py'
      - 'openapi_forge.py'
permissions:
  contents: read
jobs:
  bridge-worker:
    name: Forge five tools / tenant isolation / SDK v2
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ALDOL_API_BASE_URL: ''
      ALDOL_API_ALLOWED_HOST: ''
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact official SDK
        run: python -m pip install --no-input "mcp==2.0.0"
      - name: Verify five operations and tenant isolation
        run: python -m unittest discover -s bridge -p 'test_*.py' -v
      - name: Verify existing Forge regression
        run: python -m unittest discover -s tests -v
