name: Forge Studio - signed SDK job end-to-end
on:
  pull_request:
    branches: [main, feat/studio-sdk-v2-artifact-verifier]
    paths:
      - '.github/workflows/verify-studio-sdk-jobs.yml'
      - 'bridge/sdk_job_gateway.py'
      - 'bridge/test_sdk_job_gateway.py'
      - 'adapters/sites/**'
      - 'ci/verify_studio_archive.py'
      - 'ci/generate_studio_sdk_fixtures.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-studio-sdk-jobs.yml'
      - 'bridge/sdk_job_gateway.py'
      - 'bridge/test_sdk_job_gateway.py'
      - 'adapters/sites/**'
      - 'ci/verify_studio_archive.py'
      - 'ci/generate_studio_sdk_fixtures.mjs'
permissions:
  contents: read
jobs:
  sdk-job-e2e:
    name: Sites ZIP -> signed HTTP job -> official SDK memory/stdio
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ALDOL_API_BASE_URL: ''
      ALDOL_API_ALLOWED_HOST: ''
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Sites SDK bridge client and all UI regression tests
        working-directory: adapters/sites
        run: node --test tests/*.test.mjs
      - name: Build and inspect deployed-format Worker bundle
        working-directory: adapters/sites
        run: |
          bash scripts/build.sh
          node scripts/validate-artifact.mjs
      - name: Generate real Studio ZIP input
        run: node ci/generate_studio_sdk_fixtures.mjs
      - name: Install official MCP SDK v2
        run: python -m pip install --no-input "mcp==2.0.0"
      - name: Exercise signed HTTP job and real SDK with no external API target
        run: python -m unittest bridge.test_sdk_job_gateway -v
