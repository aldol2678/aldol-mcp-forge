name: UI MCP integration
on:
  pull_request:
    paths: ['packages/ui-mcp/**', '.github/workflows/ui-mcp-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: packages/ui-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt playwright
      - run: python -m compileall -q ui_core tests
      - run: python -m unittest discover -s tests -v
      - run: python tests/sdk_smoke.py
      - run: python tests/local_http.py /tmp/ui-mcp-http
      - run: python -m playwright install --with-deps chromium
      - name: Browser regression
        run: |
          python - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from ui_core import core
          for name,target in [('web-dashboard','web-html'),('expedition-hud-v03','game-hud-html')]:
              Path(f'examples/{name}.html').write_text(core.render(Path(f'examples/{name}.json').read_text(),target,quality_mode='enforce')['preview_html'])
          with sync_playwright() as p:
              os.environ['CHROMIUM_EXECUTABLE']=p.chromium.executable_path
          subprocess.run([sys.executable,'tests/browser_03.py'],check=True)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix tests/react-runtime
      - run: python tests/react_browser.py
