name: Game Ops source smoke
on:
  pull_request:
    paths:
      - 'packages/game-ops/**'
      - '.github/workflows/game-ops-source-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated Game Ops MCP dependencies
        run: python -m pip install -r packages/game-ops/requirements.txt pytest
      - name: MCP protocol and input security tests
        run: python -m pytest packages/game-ops/tests -q
      - name: Compile Python
        run: python -m compileall -q packages/game-ops/scripts
      - name: Run seven built-in offline tests
        run: python packages/game-ops/scripts/selftest.py
      - name: Check static HTML fixture (browser optional)
        run: |
          python packages/game-ops/scripts/html_qa.py packages/game-ops/examples/demo.html --output /tmp/aldol-game-ops-qa
          python -c "import json; from pathlib import Path; d=json.loads(Path('/tmp/aldol-game-ops-qa/candidate/report.json').read_text()); assert d['summary']['FAIL']==0; print(d['summary'])"
